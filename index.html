    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f0f0f0;
        --accent: #000000;
        --safety-orange: #FF4D00;
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--accent);
        background-image: 
          linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .font-mono {
        font-family: 'Space Mono', monospace;
      }
      .slab-shadow {
        box-shadow: 8px 8px 0px 0px #000;
      }
      .slab-shadow-hover:hover {
        box-shadow: 12px 12px 0px 0px var(--safety-orange);
        transform: translate(-4px, -4px);
      }
      .active-press:active {
        box-shadow: 0px 0px 0px 0px #000;
        transform: translate(8px, 8px);
      }

      /* Custom Invert Flash Animation */
      @keyframes flash {
        0% { filter: invert(0); }
        50% { filter: invert(1); }
        100% { filter: invert(0); }
      }
      .glitch-flash {
        animation: flash 0.2s ease-in-out;
      }
    </style>
