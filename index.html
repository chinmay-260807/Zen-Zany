<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADVICE_v3 // BRUTALIST_ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f0f0f0;
        --accent: #000000;
        --safety-orange: #FF4D00;
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--accent);
        background-image: 
          linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        transition: background-color 0.3s ease-in-out;
      }
      .font-mono {
        font-family: 'Space Mono', monospace;
      }
      .slab-shadow {
        box-shadow: 8px 8px 0px 0px #000;
      }
      .slab-shadow-white {
        box-shadow: 8px 8px 0px 0px #fff;
      }
      .active-press:active {
        box-shadow: 0px 0px 0px 0px currentColor;
        transform: translate(4px, 4px);
      }
      @keyframes flash {
        0% { filter: invert(0); }
        50% { filter: invert(1); }
        100% { filter: invert(0); }
      }
      .glitch-flash {
        animation: flash 0.15s ease-in-out;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #000;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      body.dark ::-webkit-scrollbar-thumb {
        background: #fff;
      }
    </style>
